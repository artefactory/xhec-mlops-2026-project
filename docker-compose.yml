# Full demo stack: FastAPI + Prefect UI (api) and the Streamlit interface (ui).
# Start with `docker compose up --build`, then open http://localhost:8501.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: abalone-api
    ports:
      - "8000:8001" # FastAPI
      - "4200:4201" # Prefect UI
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: abalone-ui
    ports:
      - "8501:8501"
    environment:
      # Inside the Compose network the API is reached by its service name, not localhost
      API_BASE_URL: http://api:8001
    depends_on:
      api:
        condition: service_healthy
