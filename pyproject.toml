[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Martin Lau",     email = "martin.lau@hec.edu" },
  { name = "Julian Fix",     email = "julian.fix@hec.edu" },
  { name = "Scott Mayette",  email = "scott.mayette@hec.edu" },
  { name = "Yuqi Xin",       email = "yuqi.xin@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"

dependencies = [
  "pydantic>=2.0",
  "pre-commit>=3.0",
  "ruff>=0.9.0",
  "pandas>=2.3.3",
  "numpy>=2.2.6",
]
