[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Najib Nasr", email = "najib.nasr@polytechnique.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "pandas",
  "scikit-learn",
  "prefect",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
  "ipykernel",
  "matplotlib",
  "seaborn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
