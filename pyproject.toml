[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["assets*", "notebooks*", "data*", "mlruns*"]

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "Wei Chieh", email = "weichieh-chou@users.noreply.github.com" },
  { name = "Martin d'Halloy", email = "martdhal@users.noreply.github.com" },
  { name = "Harshita Goyal", email = "hxrshu@users.noreply.github.com" },
  { name = "Maximilien Lucille", email = "MaximilienLuc@users.noreply.github.com" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.150.0",
  "matplotlib>=3.10.9",
  "mlflow>=3.17.2",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "prefect>=3.0",
  "pydantic>=2.0",
  "scikit-learn>=1.7.2",
  "seaborn>=0.13.2",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "nbstripout>=0.9.1",
  "pre-commit>=4.0",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
