repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-json
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-format
        name: Formatting (ruff)
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: ruff-fix
        name: Linting (ruff)
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-sort
        name: Sorting imports (ruff)
        entry: uv run --locked ruff check --select I --fix
        language: system
        types: [python]
      - id: nbstripout
        name: Strip Jupyter notebook output
        entry: uv run --locked nbstripout
        language: system
        files: \.ipynb$
      - id: uv-lock
        name: Check uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
exclude: ^(assets/|data/|models/|work/|\.venv/)
